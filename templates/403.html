{% extends "public_base.html" %}

{% block title %}Access denied – SwachhAI{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="container text-center">
    <div class="icon-circle mx-auto mb-3"><i class="bi bi-shield-exclamation"></i></div>
    <h1 class="h3 fw-bold">Access denied</h1>
    <p class="text-muted">{{ exception|default:"You do not have permission to view this page." }}</p>
    <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}{% url 'home' %}{% endif %}"
       class="btn btn-primary">
      {% if user.is_authenticated %}Back to dashboard{% else %}Back to home{% endif %}
    </a>
  </div>
</div>
{% endblock %}
